name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          verify-signature: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run ktlint
        run: ./gradlew :app:ktlintCheck :baselineprofile:ktlintCheck

      - name: Run detekt
        run: ./gradlew :app:detekt

      - name: Run lint
        run: ./gradlew lint :app:lintRelease

      - name: Analyze with SonarQube Cloud
        timeout-minutes: 20
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar -Dsonar.qualitygate.wait=true

      - name: Preserve test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-checks
          retention-days: 7
          path: |
            app/build/test-results/
            app/build/reports/

  optimized-smoke:
    name: Optimized runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          verify-signature: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # No signing or production service secrets are passed to this PR job.
      - name: Build optimized test target and external driver
        run: ./gradlew --no-daemon -Pknittools.optimizedSmoke=true :app:assembleBenchmarkRelease :baselineprofile:assembleBenchmarkRelease

      - name: Free runner disk space for emulator
        run: |
          df -h /
          # API 24+ images require at least 6 GiB of userdata plus 20% free-space headroom.
          # This disposable Android job uses neither Haskell nor CodeQL.
          sudo rm -rf /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run deterministic smoke on a disposable emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          # These app-only flows do not require Google apps, System UI or external pickers.
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          pre-emulator-launch-script: df -h "$HOME/.android/avd"
          script: pwsh -NoProfile -File tools/optimized-smoke.ps1 -Serial emulator-5554 -DisposableEmulator -ExpectedTests 2 -Test 'com.finnvek.knittools.baselineprofile.OptimizedSmokeTest#projectCounterSessionAndNavigation,com.finnvek.knittools.baselineprofile.OptimizedSmokeTest#freeGateTrialAndAdaptiveTransitions'

      - name: Preserve optimized artifact identity, mapping and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: optimized-smoke
          retention-days: 7
          path: |
            reports/optimized-smoke/
            app/build/outputs/apk/benchmarkRelease/output-metadata.json
            app/build/outputs/mapping/benchmarkRelease/
            baselineprofile/build/outputs/apk/benchmarkRelease/output-metadata.json

  functions:
    name: Functions (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm --prefix functions ci --ignore-scripts

      - name: Build and test Functions
        run: npm --prefix functions test
