name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          check-latest: true
          distribution: 'temurin'
          verify-signature: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android compile platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"'

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run ktlint
        run: ./gradlew :ktlintCheck :app:ktlintCheck :baselineprofile:ktlintCheck

      - name: Run detekt
        run: ./gradlew :app:detekt

      - name: Run lint
        run: ./gradlew lint :app:lintRelease

      - name: Prepare Sonar analysis inputs
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: ./gradlew :app:jacocoDebugUnitTestReport :app:compileDebugAndroidTestJavaWithJavac

      - name: Upload analysis inputs
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-inputs
          retention-days: 1
          if-no-files-found: error
          path: |
            app/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes/
            app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes/
            app/build/intermediates/javac/debugAndroidTest/compileDebugAndroidTestJavaWithJavac/classes/
            app/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml

      - name: Preserve test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-checks
          retention-days: 7
          path: |
            app/build/test-results/
            app/build/reports/

  sonar:
    needs: build
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /build.gradle.kts
            /settings.gradle.kts
            /app/build.gradle.kts
            /app/src/
            !/app/src/*/res/**/*.png
            !/app/src/*/res/**/*.webp
            !/app/src/*/res/**/*.ttf
            /sonar-project.properties

      # Read PR sources as data. Only the trusted base controls scanner settings.
      - name: Restore trusted scanner configuration
        env:
          POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: git -C source restore --source="$POLICY_SHA" --worktree -- sonar-project.properties

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-inputs
          path: analysis-inputs

      - uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        id: auth
        with:
          project-key: Insaner1980_KnitTools
          export-env: 'false'

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ steps.auth.outputs.sonar-token }}
        with:
          projectBaseDir: source
          args: >-
            -Dsonar.sources=.github,build.gradle.kts,settings.gradle.kts,app/build.gradle.kts,app/src/main/java,app/src/main/res,app/src/main/AndroidManifest.xml,app/src/debug/java,app/src/debug/res,app/src/debug/AndroidManifest.xml,app/src/debugShared/kotlin
            -Dsonar.tests=app/src/test/java,app/src/testDebug/java,app/src/androidTest/java,app/src/androidTest/AndroidManifest.xml,app/src/sharedTest/kotlin
            -Dsonar.java.binaries=../analysis-inputs/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes,../analysis-inputs/intermediates/javac/debug/compileDebugJavaWithJavac/classes
            -Dsonar.java.test.binaries=../analysis-inputs/intermediates/javac/debugAndroidTest/compileDebugAndroidTestJavaWithJavac/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=../analysis-inputs/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml
            -Dsonar.qualitygate.wait=true

  optimized-smoke:
    name: Optimized runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          check-latest: true
          distribution: 'temurin'
          verify-signature: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android compile platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"'

      # No signing or production service secrets are passed to this PR job.
      - name: Build optimized test target and external driver
        run: ./gradlew --no-daemon -Pknittools.optimizedSmoke=true :app:assembleBenchmarkRelease :baselineprofile:assembleBenchmarkRelease

      - name: Free runner disk space for emulator
        run: |
          df -h /
          # API 24+ images require at least 6 GiB of userdata plus 20% free-space headroom.
          # This disposable Android job uses neither Haskell nor CodeQL.
          sudo rm -rf /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run deterministic smoke on a disposable emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          # These app-only flows do not require Google apps, System UI or external pickers.
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          pre-emulator-launch-script: df -h "$HOME/.android/avd"
          script: pwsh -NoProfile -File tools/optimized-smoke.ps1 -Serial emulator-5554 -DisposableEmulator -ExpectedTests 2 -Test 'com.finnvek.knittools.baselineprofile.OptimizedSmokeTest#projectCounterSessionAndNavigation,com.finnvek.knittools.baselineprofile.OptimizedSmokeTest#freeGateTrialAndAdaptiveTransitions'

      - name: Preserve optimized artifact identity, mapping and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: optimized-smoke
          retention-days: 7
          path: |
            reports/optimized-smoke/
            app/build/outputs/apk/benchmarkRelease/output-metadata.json
            app/build/outputs/mapping/benchmarkRelease/
            baselineprofile/build/outputs/apk/benchmarkRelease/output-metadata.json

  functions:
    # Keep the check name required by the main branch ruleset.
    name: Functions (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the retired Ravelry backend is absent
        run: |
          backend_files=$(git ls-files -- functions/ .firebaserc firebase.json firestore.rules firestore.indexes.json)
          if [ -n "$backend_files" ]; then
            printf 'Retired Ravelry backend files are still tracked:\n%s\n' "$backend_files"
            exit 1
          fi
