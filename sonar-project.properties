sonar.projectKey=Insaner1980_KnitTools
sonar.organization=insaner1980

# Use native Git blame to avoid JGit MissingObjectException on valid local objects.
sonar.scm.use.blame.algorithm=GIT_NATIVE_BLAME

sonar.sources=app/src/main/java
sonar.java.binaries=app/build/intermediates/javac/debug/classes,app/build/tmp/kotlin-classes/debug

# Exclusions
sonar.exclusions=**/build/**,**/generated/**,**/*Generated*.kt,baselineprofile/**

# Duplication exclusions
sonar.cpd.exclusions=**/build/**,**/generated/**

# Coverage exclusions
# Coverage-portti mittaa domain-, repository- ja parserilogiikkaa, ei UI-/framework-sidonnaisia reunoja.
sonar.coverage.exclusions=**/build/**,**/generated/**,baselineprofile/**,**/App.kt,**/MainActivity.kt,**/SentryInit.kt,**/di/**,**/ui/**,**/widget/**,**/auth/**,**/billing/**,**/pro/**,**/data/datastore/**,**/data/storage/**,**/data/remote/**,**/data/local/**
